<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 200" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1117" />
      <stop offset="100%" stop-color="#161b22" />
    </linearGradient>
    <linearGradient id="glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#58a6ff" />
      <stop offset="50%" stop-color="#8957e5" />
      <stop offset="100%" stop-color="#238636" />
      <animate attributeName="x1" values="-100%;100%" dur="5s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="0%;200%" dur="5s" repeatCount="indefinite"/>
    </linearGradient>
    <style>
      .title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; font-size: 48px; font-weight: 800; fill: #c9d1d9; }
      .subtitle { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; font-size: 20px; font-weight: 400; fill: #8b949e; }
      .accent { fill: url(#glow); font-family: monospace; font-size: 48px; font-weight: 800;}
      .line { stroke: url(#glow); stroke-width: 4; stroke-dasharray: 800; stroke-dashoffset: 800; animation: draw 3s ease-in-out infinite alternate; }
      @keyframes draw { to { stroke-dashoffset: 0; } }
      .pulse { animation: pulse 2s infinite ease-in-out; }
      @keyframes pulse { 0%, 100% { opacity: 0.8; } 50% { opacity: 0.3; } }
    </style>
  </defs>
  
  <!-- Background -->
  <rect width="100%" height="100%" fill="url(#bg)" rx="15" ry="15" />
  <rect width="100%" height="100%" fill="none" stroke="#30363d" stroke-width="2" rx="15" ry="15" />

  <!-- Animated Bottom Line -->
  <line x1="0" y1="198" x2="800" y2="198" class="line" />
  
  <!-- Content -->
  <g transform="translate(400, 90)" text-anchor="middle">
    <text y="0" class="title">
      <tspan class="accent">&gt; </tspan>gh-browse-or-reload
      <tspan class="accent pulse">_</tspan>
    </text>
    <text y="40" class="subtitle">Smart tab management for the GitHub CLI</text>
  </g>
</svg>
