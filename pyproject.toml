[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "gh-browse-or-reload"
version = "0.1.1"
authors = [
  { name="Ishan", email="ishandutta2007@gmail.com" },
]
description = "A wrapper around gh browse that reloads an existing browser tab if possible."
readme = "README.md"
requires-python = ">=3.7"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]

[project.scripts]
gh-browse-or-reload = "gh_browse_or_reload.cli:main"
